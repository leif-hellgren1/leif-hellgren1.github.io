# Deploy the static site to GitHub Pages on every push to main.
# Standard Pages "upload the whole repo root as the artifact" workflow — no build step,
# because the site is a single hand-written index.html plus its assets.
name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you trigger a deploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'          # repo root: index.html plus the image assets
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
